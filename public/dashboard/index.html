<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Runs · GTA 6 Bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23f38020'/%3E%3Ctext x='20' y='27' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='700' font-size='19'%3EVI%3C/text%3E%3C/svg%3E">
  <script>try { const theme = localStorage.getItem('dashboard-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}</script>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="/dashboard/live.js" defer></script>
  <script src="/dashboard/traversal.js" defer></script>
  <script src="/dashboard/replay.js" defer></script>
  <script src="/dashboard/tasks.js" defer></script>
  <script src="/dashboard/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" role="status"><span class="brand-mark" aria-hidden="true">VI</span><span>Loading…</span></div>
  <div id="auth" class="auth-screen" hidden></div>
  <div id="workspace" class="workspace" hidden>
    <header class="topbar">
      <button class="icon-button menu-toggle" type="button" data-action="toggle-menu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <a class="brand" href="#/" aria-label="GTA 6 Bench home"><span class="brand-mark" aria-hidden="true">VI</span><span class="brand-name">GTA 6 Bench</span></a>
      <div class="breadcrumb"><span class="breadcrumb-slash" aria-hidden="true">/</span><span id="breadcrumb-current">Runs</span></div>
      <div class="goto" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="goto-input" type="search" placeholder="Go to a run or task…" aria-label="Go to a run or task" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="goto-results" aria-autocomplete="list">
        <kbd class="goto-key" aria-hidden="true">Ctrl K</kbd>
        <ul id="goto-results" class="goto-results" role="listbox" aria-label="Matches" hidden></ul>
      </div>
      <div class="topbar-right">
        <button class="icon-button" type="button" data-action="toggle-theme" aria-label="Switch between light and dark" title="Switch between light and dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <button class="mobile-new icon-button" data-action="new-run" aria-label="New run" title="New run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
      <nav><a class="nav-link" id="overview-link" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All runs<span id="run-count" class="nav-count">0</span></a><a class="nav-link" id="tasks-link" href="#/tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 8 1 1 2-2M14 8h2M8 13h8M8 17h5"/></svg>My tasks<span id="task-count" class="nav-count">0</span></a></nav>
      <div class="sidebar-section"><span class="eyebrow">Recent runs</span><button class="icon-button small" data-action="new-run" aria-label="New run" title="New run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <nav id="recent-runs" class="recent-runs" aria-label="Recent runs"></nav>
      <div class="sidebar-footer"><button id="logout" class="nav-link" data-action="logout" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Sign out</button></div>
    </aside>
    <div class="sidebar-scrim" data-action="toggle-menu" hidden></div>
    <div class="main-column">
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>GTA 6 Bench</span><span>Simulated purchases</span></footer>
    </div>
  </div>
  <dialog id="create-dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="traversal-dialog" class="traversal-dialog" aria-labelledby="traversal-title"></dialog>
  <dialog id="replay-dialog" class="traversal-dialog replay-dialog" aria-labelledby="replay-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
