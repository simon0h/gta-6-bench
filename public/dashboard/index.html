<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Runs · GTA 6 Bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23252820'/%3E%3Ctext x='7' y='29' fill='%23f5f2e8' font-family='Georgia' font-size='25'%3EVI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="/dashboard/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" role="status"><span class="brand-mark" aria-hidden="true">VI</span><span>Opening your workspace…</span></div>
  <div id="auth" class="auth-screen" hidden></div>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#/" aria-label="GTA 6 Bench home"><span class="brand-mark" aria-hidden="true">VI</span><span>GTA 6 <strong>Bench</strong><small>AGENT EVALUATIONS</small></span></a>
      <nav><a class="nav-link" id="overview-link" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All runs<span id="run-count" class="nav-count">0</span></a></nav>
      <div class="sidebar-section"><span class="eyebrow">RECENT RUNS</span><button class="icon-button" data-action="new-run" aria-label="Generate a new run" title="Generate a new run">+</button></div>
      <nav id="recent-runs" class="recent-runs" aria-label="Recent runs"></nav>
      <div class="sidebar-footer"><div class="workspace-status"><span class="status-dot"></span><span id="connection-label">Workspace connected</span></div><p>Controlled tasks.<br>Comparable outcomes.</p><button id="logout" class="text-button" data-action="logout" hidden>Sign out <span aria-hidden="true">↗</span></button></div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div class="breadcrumb"><span class="breadcrumb-brand">GTA 6 Bench</span><span class="breadcrumb-slash">/</span><span id="breadcrumb-current">Runs</span></div><div class="topbar-right"><span class="environment-label"><span class="status-dot"></span>Benchmark workspace</span><button class="mobile-new icon-button" data-action="new-run" aria-label="Generate a new run">+</button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>GTA 6 Bench</span><span>Synthetic storefronts · No real purchases</span></footer>
    </div>
  </div>
  <dialog id="create-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
