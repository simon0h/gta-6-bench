<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Runs · GTA 6 Bench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='13' fill='%230072de'/%3E%3Ctext x='20' y='27' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='700' font-size='19'%3EVI%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/dashboard/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="/dashboard/live.js" defer></script>
  <script src="/dashboard/traversal.js" defer></script>
  <script src="/dashboard/replay.js" defer></script>
  <script src="/dashboard/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" role="status"><span class="brand-mark" aria-hidden="true">VI</span><span>Loading…</span></div>
  <div id="auth" class="auth-screen" hidden></div>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="Dashboard navigation">
      <a class="brand" href="#/" aria-label="GTA 6 Bench home"><span class="brand-mark" aria-hidden="true">VI</span><span>GTA 6 <strong>Bench</strong></span></a>
      <nav><a class="nav-link" id="overview-link" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All runs<span id="run-count" class="nav-count">0</span></a></nav>
      <div class="sidebar-section"><span class="eyebrow">Recent runs</span><button class="icon-button" data-action="new-run" aria-label="New run" title="New run">+</button></div>
      <nav id="recent-runs" class="recent-runs" aria-label="Recent runs"></nav>
      <div class="sidebar-footer"><button id="logout" class="text-button" data-action="logout" hidden>Sign out</button></div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div class="breadcrumb"><span class="breadcrumb-brand">GTA 6 Bench</span><span class="breadcrumb-slash">/</span><span id="breadcrumb-current">Runs</span></div><div class="topbar-right"><button class="mobile-new icon-button" data-action="new-run" aria-label="New run">+</button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer"><span>GTA 6 Bench</span><span>Simulated purchases</span></footer>
    </div>
  </div>
  <dialog id="create-dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="traversal-dialog" class="traversal-dialog" aria-labelledby="traversal-title"></dialog>
  <dialog id="replay-dialog" class="traversal-dialog replay-dialog" aria-labelledby="replay-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
